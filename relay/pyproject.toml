[project]
name = "tripcrew-relay"
version = "0.1.0"
description = "Silent Switch Viewer and local game event relay"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.uv]
package = false
no-build = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
