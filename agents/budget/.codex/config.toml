approval_policy = "never"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# Relative to this .codex directory, not the session's working directory.
writable_roots = ["../../../state"]
network_access = true

[features.network_proxy]
enabled = true

[features.network_proxy.domains]
"api.frankfurter.dev" = "allow"

[shell_environment_policy.set]
# Reuse tools/.venv after the owner's initial uv sync, without registry access
# or writes to the shared tools environment/cache. Python can still fetch FX.
UV_NO_SYNC = "1"
UV_FROZEN = "1"
UV_OFFLINE = "1"
UV_NO_CACHE = "1"
UV_PYTHON_DOWNLOADS = "never"
PYTHONDONTWRITEBYTECODE = "1"
